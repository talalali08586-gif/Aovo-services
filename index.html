<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AOVO Services — International Voiceover &amp; Audio Services</title>
<!-- SEARCH & SHARING — the description Google shows under the link in
     search results, the page's one official address (canonical, so the
     www and non-www versions count as the same page), and the preview card
     shown when the link is shared on WhatsApp, LinkedIn, Facebook, etc. -->
<meta name="description" content="Professional English and Arabic voiceover for documentaries, commercials, e-learning, IVR, video games and more. Listen to sample demos and request a quote." />
<link rel="canonical" href="https://aovoservices.com/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="AOVO Services" />
<meta property="og:title" content="AOVO Services — International Voiceover &amp; Audio Services" />
<meta property="og:description" content="Professional English and Arabic voiceover for documentaries, commercials, e-learning, IVR, video games and more. Listen to sample demos and request a quote." />
<meta property="og:url" content="https://aovoservices.com/" />
<meta property="og:image" content="https://aovoservices.com/assets/img/og-image.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<!-- BUSINESS DETAILS FOR SEARCH ENGINES — not shown on the page. Tells
     Google who AOVO is, what it offers and how to reach it, so search
     results can show a fuller business listing. Keep in step with the
     About and Contact pages if any of these details change. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "AOVO Services",
  "legalName": "AOVO Services, LLC",
  "url": "https://aovoservices.com/",
  "logo": "https://aovoservices.com/assets/img/logo-gold.png",
  "image": "https://aovoservices.com/assets/img/og-image.jpg",
  "email": "info@aovoservices.com",
  "description": "International voiceover and audio-production services in English and Arabic: voice acting, English–Arabic localization, audio editing, restoration, mixing and mastering.",
  "areaServed": "Worldwide",
  "knowsLanguage": ["en", "ar"],
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Voiceover and audio services",
    "itemListElement": [
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Voiceover" } },
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "English–Arabic localization and translation" } },
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Audio cleaning, restoration and post-production" } }
    ]
  }
}
</script>
<!-- Favicons: the gold AOVO mic on charcoal (browser tab, Android, iOS home screen). -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- The ?v= number is a cache-buster — bump it (in every HTML file) whenever
     the stylesheet changes, so phones and CDNs refresh their cached copy. -->
<link rel="stylesheet" href="assets/css/style.css?v=21">
</head>
<body>

<!-- ============================================================
     SITE HEADER — shared across all pages: logo on the left, nav
     links on the right. Keep the links identical on every page and
     move the "active" class to whichever page the file belongs to.
     On small screens the links hide behind the hamburger button;
     the toggle logic lives at the top of assets/js/main.js.
     ============================================================ -->
<header class="site-header">
  <a class="site-logo" href="index.html">
    <img src="assets/img/logo-white.png" alt="AOVO Services logo" />
  </a>
  <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav">
    <span class="nav-toggle-text">Menu</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <nav class="site-nav" id="siteNav" aria-label="Site">
    <a href="index.html" class="active">Home</a>
    <a href="feedback.html">Feedback</a>
    <a href="audio-services.html">Audio Services</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="hero">

  <!-- BRAND BAND — title block in normal flow ABOVE the photo, so it can
       never overlap the person at any screen width. The photo's top
       vignette blends into the band's dark background, so the hero still
       reads as one continuous composition. -->
  <header class="brand">
    <!-- The larger desktop logo sits independently at the left-side marker in
         the approved reference. Keeping it outside the title stack lets the
         title, subtitle, and demo hint remain precisely centred. -->
    <img class="brand-logo" src="assets/img/logo-white.png" alt="" />
    <h1>AOVO Services</h1>
    <div class="pill">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      International Voiceover and Audio Services
    </div>
    <p class="cta">Click on any label to hear sample demos</p>
  </header>

  <!-- STAGE WRAP — the photo box plus everything positioned over it (the
       12 service labels and the quote button). On desktop the labels and
       button are pinned to the photo; on phones they drop below it into
       the stacked layout. -->
  <div class="stage-wrap">
    <div class="stage">
      <!-- Phones/tablets get hero-2-mobile.jpg: a pre-cropped 1600x1360 portrait
           version of the same photo. Hostinger's CDN image optimizer shrinks any
           image wider than ~1600px (it served the 2688px original at 1600x905,
           which phones then had to stretch back up — that read as "blurry on
           mobile"). The mobile file is already at/below that cap, so the CDN
           passes it through and phones render it pixel-sharp. Desktop keeps the
           full-resolution original. -->
      <picture>
        <source media="(max-width:860px)" srcset="assets/img/hero-2-mobile.jpg" width="1600" height="1360" />
        <img class="stage-photo" src="assets/img/hero-2.jpg" alt="AOVO voiceover artist in a professional studio" width="2688" height="1520" loading="eager" fetchpriority="high" />
      </picture>
    </div>

    <!-- LEFT COLUMN -->
    <nav class="col col-left" aria-label="Voiceover categories left">
    </nav>

    <!-- RIGHT COLUMN -->
    <nav class="col col-right" aria-label="Voiceover categories right">
    </nav>

    <a class="quote-cta" href="contact.html">Request a Quote</a>
  </div>
</section>

<!-- MODAL -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="modal">
    <button class="x" id="closeBtn" aria-label="Close">&times;</button>
    <div class="eyebrow">Sample Demo</div>
    <h2 id="m-title">Service</h2>
    <p class="sub" id="m-description">Listen to a sample demo or download the file.</p>

    <div class="lang-card en">
      <span class="lang-badge">EN</span>
      <span class="name">English</span>
      <button class="btn btn-play" id="play-en"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Play</button>
      <a class="btn btn-dl" id="dl-en" download><svg viewBox="0 0 24 24"><path d="M12 3v10m0 0l4-4m-4 4l-4-4M5 19h14"/></svg> Download</a>
    </div>

    <div class="lang-card ar">
      <span class="lang-badge">AR</span>
      <span class="name">Arabic</span>
      <button class="btn btn-play" id="play-ar"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Play</button>
      <a class="btn btn-dl" id="dl-ar" download><svg viewBox="0 0 24 24"><path d="M12 3v10m0 0l4-4m-4 4l-4-4M5 19h14"/></svg> Download</a>
    </div>

    <div class="nowplaying" id="nowplaying">
      <span id="np-text">Not playing</span>
      <input type="range" class="seek" id="np-seek" min="0" max="100" value="0" step="0.1" aria-label="Seek" disabled>
    </div>
  </div>
</div>

<audio id="player" preload="none"></audio>

<script src="data/demos.js"></script>
<script src="assets/js/audio-ui.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
